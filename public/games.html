<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Discord Chess - 対局一覧</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    background: #eef1f5;

    color: #111827;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

}

.container {

    width: min(100%, 1000px);

    margin: 0 auto;

    padding: 24px;

}

header {

    margin-bottom: 24px;

}

h1 {

    margin: 0;

    font-size: 30px;

}

.subtitle {

    margin-top: 6px;

    color: #6b7280;

}

.summary {

    display: flex;

    gap: 12px;

    flex-wrap: wrap;

    margin-bottom: 20px;

}

.summary-card {

    background: white;

    border-radius: 12px;

    padding: 14px 18px;

    border: 1px solid #d1d5db;

}

.summary-label {

    color: #6b7280;

    font-size: 12px;

}

.summary-value {

    margin-top: 4px;

    font-size: 22px;

    font-weight: 800;

}

.games {

    display: grid;

    gap: 14px;

}

.game {

    background: white;

    border: 1px solid #d1d5db;

    border-radius: 16px;

    padding: 18px;

    box-shadow:
        0 5px 16px
        rgba(0,0,0,.06);

}

.game-header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 12px;

    margin-bottom: 12px;

}

.game-title {

    font-size: 18px;

    font-weight: 800;

}

.status {

    padding: 6px 10px;

    border-radius: 999px;

    background: #dcfce7;

    color: #166534;

    font-size: 12px;

    font-weight: 800;

    white-space: nowrap;

}

.players {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 10px;

    margin-bottom: 12px;

}

.player {

    padding: 12px;

    border-radius: 10px;

    background: #f9fafb;

}

.player-name {

    margin-top: 3px;

    font-weight: 800;

}

.turn {

    margin-bottom: 12px;

    font-weight: 700;

}

.actions {

    display: flex;

    gap: 10px;

    flex-wrap: wrap;

}

.button {

    display: inline-block;

    padding: 10px 15px;

    border-radius: 10px;

    text-decoration: none;

    font-weight: 800;

    font-size: 14px;

}

.watch {

    background: #2563eb;

    color: white;

}

.refresh {

    background: #e5e7eb;

    color: #111827;

    border: 0;

    cursor: pointer;

}

.meta {

    margin-top: 10px;

    color: #6b7280;

    font-size: 12px;

    word-break: break-all;

}

.empty {

    background: white;

    border: 1px solid #d1d5db;

    border-radius: 16px;

    padding: 40px 20px;

    text-align: center;

    color: #6b7280;

}

.error {

    background: #fef2f2;

    border: 1px solid #fecaca;

    color: #991b1b;

    border-radius: 12px;

    padding: 14px;

}

@media (
    max-width: 600px
) {

    .container {

        padding: 14px;

    }

    .players {

        grid-template-columns: 1fr;

    }

    .game-header {

        align-items: flex-start;

    }

}

</style>

</head>


<body>

<div class="container">

    <header>

        <h1>
            ♟ Discord Chess
        </h1>

        <div class="subtitle">
            現在進行中の対局一覧
        </div>

    </header>


    <div class="summary">

        <div class="summary-card">

            <div class="summary-label">
                進行中
            </div>

            <div
                id="activeCount"
                class="summary-value"
            >
                -
            </div>

        </div>


        <div class="summary-card">

            <div class="summary-label">
                最大
            </div>

            <div
                id="maxCount"
                class="summary-value"
            >
                35
            </div>

        </div>


        <button
            id="refreshButton"
            class="button refresh"
        >
            🔄 更新
        </button>

    </div>


    <div id="message"></div>

    <div
        id="games"
        class="games"
    ></div>

</div>


<script>

const gamesElement =
    document.getElementById(
        'games'
    );


const activeCountElement =
    document.getElementById(
        'activeCount'
    );


const maxCountElement =
    document.getElementById(
        'maxCount'
    );


const messageElement =
    document.getElementById(
        'message'
    );


const refreshButton =
    document.getElementById(
        'refreshButton'
    );


function observerUrl(
    gameId
) {

    return (
        `/?game=${encodeURIComponent(
            gameId
        )}`
    );

}


function escapeHtml(
    value
) {

    const div =
        document.createElement(
            'div'
        );

    div.textContent =
        value ?? '';

    return div.innerHTML;

}


function renderGames(
    games
) {

    gamesElement.innerHTML =
        '';

    if (
        games.length === 0
    ) {

        gamesElement.innerHTML = `
            <div class="empty">
                現在進行中の対局はありません。
            </div>
        `;

        return;

    }


    for (
        const game of games
    ) {

        const white =
            escapeHtml(
                game.white?.name ||
                '白'
            );


        const black =
            escapeHtml(
                game.black?.name ||
                '黒'
            );


        const turn =
            game.turn === 'white'
                ? '⚪ 白の手番'
                : '⚫ 黒の手番';


        const status =
            game.chessStatus === 'check'
                ? '⚠️ チェック'
                : '🎮 対局中';


        const element =
            document.createElement(
                'div'
            );


        element.className =
            'game';


        element.innerHTML = `

            <div class="game-header">

                <div class="game-title">
                    ${white}
                    vs
                    ${black}
                </div>

                <div class="status">
                    ${status}
                </div>

            </div>


            <div class="players">

                <div class="player">

                    <div>⚪ 白</div>

                    <div class="player-name">
                        ${white}
                    </div>

                </div>


                <div class="player">

                    <div>⚫ 黒</div>

                    <div class="player-name">
                        ${black}
                    </div>

                </div>

            </div>


            <div class="turn">
                ${turn}
            </div>


            <div class="actions">

                <a
                    class="button watch"
                    href="${observerUrl(game.id)}"
                >
                    👁 観戦する
                </a>

            </div>


            <div class="meta">
                Game ID:
                ${escapeHtml(game.id)}
            </div>

        `;


        gamesElement.appendChild(
            element
        );

    }

}


async function loadGames() {

    messageElement.innerHTML =
        '';

    try {

        const response =
            await fetch(
                '/api/games?active=1',
                {
                    cache:
                        'no-store'
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                `HTTP ${response.status}`
            );

        }


        const games =
            data.games || [];


        activeCountElement.textContent =
            data.activeGames ??
            games.length;


        maxCountElement.textContent =
            data.maxActiveGames ??
            35;


        renderGames(
            games
        );


    } catch (error) {

        console.error(
            error
        );

        gamesElement.innerHTML =
            '';

        messageElement.innerHTML = `
            <div class="error">
                対局一覧を取得できませんでした。
                <br>
                ${escapeHtml(
                    error.message
                )}
            </div>
        `;

    }

}


refreshButton.addEventListener(
    'click',
    loadGames
);


loadGames();


setInterval(
    loadGames,
    3000
);

</script>

</body>

</html>
